<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#F4F1EC;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0C0E10;text-decoration:none}a:hover{color:#2C5CF6}
@keyframes wIn{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes swA{from{opacity:0;transform:translateY(.32em) scale(.97);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes swB{from{opacity:0;transform:translateY(.32em) scale(.97);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes navIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;background:#0C0E10;overflow:hidden">
  <video src="./hero.mp4" ref="{{ videoRef }}" autoPlay="{{ true }}" playsInline="{{ true }}" preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,14,16,.44) 0%,rgba(12,14,16,.06) 22%,rgba(12,14,16,.42) 52%,rgba(12,14,16,.9) 100%)"></div>

  <header style="position:absolute;top:24px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:8px 8px 8px 26px;border-radius:999px;background:rgba(244,241,236,.9);backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(12,14,16,.06);animation:navIn .9s cubic-bezier(.16,1,.3,1) both;z-index:3">
    <img src="./logo-black.png" alt="Snaphomz" style="height:19px;width:auto;display:block">
    <nav style="display:flex;align-items:center;gap:30px;font-size:13.5px;font-weight:500;letter-spacing:-0.008em;color:#0C0E10">
      <a href="#">About us</a><a href="#">Services</a><a href="#">Snap tools</a><a href="#">Blog</a>
    </nav>
    <div style="display:flex;align-items:center;gap:14px">
      <a href="#" style="font-size:13.5px;font-weight:500;color:#71767E">Sign in</a>
      <a href="#" style="padding:12px 22px;border-radius:999px;background:#2C5CF6;color:#F4F1EC;font-size:13.5px;font-weight:600;letter-spacing:-0.008em">Sign up</a>
    </div>
  </header>

  <div style="position:absolute;left:56px;right:56px;top:236px;z-index:2">
    <p style="margin:0;font-size:94px;line-height:1.14;letter-spacing:-0.045em;color:#F4F1EC;font-variation-settings:'wdth' 88,'wght' 400;max-width:1290px">
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .05s both">I</span>
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .1s both">want</span>
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .15s both">a</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.06em;line-height:1;color:#F4F1EC;text-decoration:underline;text-decoration-color:rgba(44,92,246,.9);text-underline-offset:.14em;text-decoration-thickness:3px;animation:{{ animBeds }}">{{ beds }}</span>
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .25s both">home</span>
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .3s both">in</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.06em;line-height:1;padding:.04em .2em .1em;margin:0 -.12em;border-radius:8px;background:#2C5CF6;color:#F4F1EC;animation:{{ animCity }}">{{ city }}</span>
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .4s both">with</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.06em;line-height:1;text-decoration:underline;text-decoration-color:rgba(44,92,246,.9);text-underline-offset:.14em;text-decoration-thickness:3px;animation:{{ animVibe }}">{{ vibe }}</span><span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .45s both">,</span>
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .5s both">near</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.06em;line-height:1;text-decoration:underline;text-decoration-color:rgba(44,92,246,.9);text-underline-offset:.14em;text-decoration-thickness:3px;animation:{{ animNear }}">{{ near }}</span><span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .55s both">,</span>
      <span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .6s both">around</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.06em;line-height:1;text-decoration:underline;text-decoration-color:rgba(44,92,246,.9);text-underline-offset:.14em;text-decoration-thickness:3px;animation:{{ animPrice }}">{{ price }}</span><span style="display:inline-block;animation:wIn 1s cubic-bezier(.16,1,.3,1) .65s both">.</span>
    </p>
  </div>

  <div style="position:absolute;left:56px;right:56px;bottom:0;display:flex;align-items:flex-end;gap:18px;animation:riseIn 1.3s cubic-bezier(.16,1,.3,1) 1.15s both;z-index:2">
    <div style="display:flex;flex-direction:column;gap:14px;padding-bottom:34px;flex:none;width:224px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,236,.55)">{{ matchLabel }}</span>
      <span style="font-size:15px;font-weight:450;letter-spacing:-0.015em;color:rgba(244,241,236,.8);line-height:1.35">Keep scrolling. They're already sorted.</span>
    </div>
    <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
      <div style="border-radius:16px 16px 0 0;overflow:hidden;background:#F4F1EC;height:158px;display:flex;flex-direction:column">
        <image-slot id="hero-l1" placeholder="listing photo 1" style="flex:1;width:100%"></image-slot>
        <div style="padding:11px 13px 0"><span style="font-size:15px;font-weight:650;letter-spacing:-0.02em;color:#0C0E10">$492,000</span></div>
      </div>
      <div style="border-radius:16px 16px 0 0;overflow:hidden;background:#F4F1EC;height:186px;display:flex;flex-direction:column">
        <image-slot id="hero-l2" placeholder="listing photo 2" style="flex:1;width:100%"></image-slot>
        <div style="padding:11px 13px 0"><span style="font-size:15px;font-weight:650;letter-spacing:-0.02em;color:#0C0E10">$475,000</span></div>
      </div>
      <div style="border-radius:16px 16px 0 0;overflow:hidden;background:#F4F1EC;height:158px;display:flex;flex-direction:column">
        <image-slot id="hero-l3" placeholder="listing photo 3" style="flex:1;width:100%"></image-slot>
        <div style="padding:11px 13px 0"><span style="font-size:15px;font-weight:650;letter-spacing:-0.02em;color:#0C0E10">$499,000</span></div>
      </div>
      <div style="border-radius:16px 16px 0 0;overflow:hidden;background:#F4F1EC;height:186px;display:flex;flex-direction:column">
        <image-slot id="hero-l4" placeholder="listing photo 4" style="flex:1;width:100%"></image-slot>
        <div style="padding:11px 13px 0"><span style="font-size:15px;font-weight:650;letter-spacing:-0.02em;color:#0C0E10">$510,000</span></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const BEDS = ["4 bed", "3 bed", "5 bed", "2 bed"];
const CITIES = ["San Jose", "Austin", "Los Angeles", "Houston", "San Diego"];
const VIBES = ["natural light", "a modern kitchen", "mountain views", "a garden"];
const NEAR = ["hiking trails", "good schools", "parks", "the downtown"];
const PRICES = ["$900K", "$650K", "$1.2M", "$475K"];

class Component extends DCLogic {
  state = { i: 0, n: 1284 };
  videoRef = React.createRef();
  componentDidMount() {
    const v = this.videoRef.current;
    if (v) { v.muted = true; v.defaultMuted = true; v.loop = true; v.play().catch(() => {}); }
    this.t = setInterval(() => this.setState(s => ({
      i: s.i + 1, n: 640 + Math.floor(Math.random() * 1500)
    })), 2900);
  }
  componentWillUnmount() { clearInterval(this.t); }
  anim(delay) {
    const name = this.state.i % 2 ? "swB" : "swA";
    const d = this.state.i === 0 ? delay : "0s";
    return `${name} .8s cubic-bezier(.16,1,.3,1) ${d} both`;
  }
  renderVals() {
    const i = this.state.i;
    const pick = a => a[i % a.length];
    return {
      videoRef: this.videoRef,
      beds: pick(BEDS), city: pick(CITIES), vibe: pick(VIBES), near: pick(NEAR), price: pick(PRICES),
      animBeds: this.anim(".2s"), animCity: this.anim(".35s"), animVibe: this.anim(".45s"),
      animNear: this.anim(".55s"), animPrice: this.anim(".65s"),
      matchLabel: this.state.n.toLocaleString() + " homes match"
    };
  }
}
</script>
</body>
</html>
