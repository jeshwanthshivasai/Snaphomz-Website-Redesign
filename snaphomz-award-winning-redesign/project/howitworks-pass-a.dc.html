<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body{margin:0;background:#F4F1EC;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0C0E10;text-decoration:none}a:hover{color:#2C5CF6}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;background:#F4F1EC;overflow:hidden">

  <div style="position:absolute;left:54px;top:52px;display:flex;align-items:center;gap:14px">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9AA0A8">01 / 04</span>
    <span style="width:56px;height:1px;background:#0C0E10;opacity:.18;display:block"></span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9AA0A8">How it works</span>
  </div>

  <h2 style="position:absolute;left:34px;top:96px;margin:0;font-size:214px;line-height:.82;letter-spacing:-0.06em;font-variation-settings:'wdth' 74,'wght' 500;color:#0C0E10">Discover</h2>

  <div style="position:absolute;left:54px;bottom:96px;width:568px;display:flex;flex-direction:column;gap:22px">
    <h3 style="margin:0;font-size:46px;line-height:1.06;letter-spacing:-0.038em;font-variation-settings:'wdth' 98,'wght' 600;color:#0C0E10">Describe the home in your own words.</h3>
    <p style="margin:0;font-size:17.5px;line-height:1.62;letter-spacing:-0.012em;color:#5C626A;max-width:520px;text-wrap:pretty">No filters. No forms. No endless checkboxes. Say it the way you'd say it out loud, and Snaphomz reads meaning - not just keywords - turning your words into real listings that match the home you're picturing.</p>
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
      <span style="width:7px;height:7px;border-radius:50%;background:#00D4C8;display:block"></span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#0C0E10">Natural search</span>
    </div>
  </div>

  <div style="position:absolute;right:118px;top:82px;width:372px;height:736px;border-radius:54px;background:#0C0E10;padding:10px;box-shadow:0 60px 120px -40px rgba(12,14,16,.45),0 8px 26px -10px rgba(12,14,16,.25);transform:rotate(3.2deg)">
    <div style="position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;background:#F4F1EC">
      <image-slot id="hiw-a-screen" src="./phone-screen.png" shape="rect" fit="cover" placeholder="phone screen" style="width:100%;height:100%"></image-slot>
    </div>
  </div>

  <div style="position:absolute;right:54px;bottom:52px;display:flex;gap:9px;align-items:center">
    <span style="width:26px;height:3px;border-radius:2px;background:#0C0E10;display:block"></span>
    <span style="width:26px;height:3px;border-radius:2px;background:rgba(12,14,16,.16);display:block"></span>
    <span style="width:26px;height:3px;border-radius:2px;background:rgba(12,14,16,.16);display:block"></span>
    <span style="width:26px;height:3px;border-radius:2px;background:rgba(12,14,16,.16);display:block"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}"></script>
</body>
</html>
