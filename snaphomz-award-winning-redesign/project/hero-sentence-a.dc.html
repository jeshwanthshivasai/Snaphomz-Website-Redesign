<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F1EC;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0C0E10;text-decoration:none}a:hover{color:#2C5CF6}
@keyframes wIn{from{opacity:0;transform:translateY(16px);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes swA{from{opacity:0;transform:translateY(.3em);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes swB{from{opacity:0;transform:translateY(.3em);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes navIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes cueIn{from{opacity:0}to{opacity:1}}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;background:#0C0E10;overflow:hidden">
  <video src="./hero.mp4" ref="{{ videoRef }}" autoPlay="{{ true }}" playsInline="{{ true }}" preload="auto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,14,16,.36) 0%,rgba(12,14,16,0) 26%,rgba(12,14,16,.24) 54%,rgba(12,14,16,.78) 100%)"></div>

  <header style="position:absolute;top:34px;left:54px;right:54px;display:flex;align-items:center;justify-content:space-between;gap:24px;animation:navIn .9s cubic-bezier(.16,1,.3,1) both">
    <img src="./logo-black.png" alt="Snaphomz" style="height:21px;width:auto;display:block;filter:brightness(0) invert(1)">
    <nav style="display:flex;align-items:center;gap:34px;font-size:14px;font-weight:500;letter-spacing:-0.008em">
      <a href="#" style="color:rgba(244,241,236,.88)" style-hover="color:#F4F1EC">About us</a><a href="#" style="color:rgba(244,241,236,.88)" style-hover="color:#F4F1EC">Services</a><a href="#" style="color:rgba(244,241,236,.88)" style-hover="color:#F4F1EC">Snap tools</a><a href="#" style="color:rgba(244,241,236,.88)" style-hover="color:#F4F1EC">Blog</a>
    </nav>
    <div style="display:flex;align-items:center;gap:22px">
      <a href="#" style="font-size:14px;font-weight:500;color:rgba(244,241,236,.7)" style-hover="color:#F4F1EC">Sign in</a>
      <a href="#" style="padding:12px 24px;border-radius:999px;background:#F4F1EC;color:#0C0E10;font-size:14px;font-weight:600;letter-spacing:-0.008em" style-hover="background:#2C5CF6;color:#F4F1EC">Sign up</a>
    </div>
  </header>

  <div style="position:absolute;left:54px;bottom:94px;width:1210px">
    <p style="margin:0;font-size:71px;line-height:1.3;letter-spacing:-0.035em;color:#F4F1EC;font-variation-settings:'wdth' 96,'wght' 450">
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .05s both">I</span>
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .1s both">want</span>
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .15s both">a</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.08em;color:#00D4C8;border-bottom:2px solid rgba(0,212,200,.6);line-height:1;animation:{{ animBeds }}">{{ beds }}</span>
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .25s both">home</span>
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .3s both">in</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.08em;line-height:1;padding:.06em .18em .1em;margin:0 -.1em;border-radius:7px;color:#00D4C8;background:rgba(0,212,200,.14);animation:{{ animCity }}">{{ city }}</span>
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .4s both">with</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.08em;color:#00D4C8;border-bottom:2px solid rgba(0,212,200,.6);line-height:1;animation:{{ animVibe }}">{{ vibe }}</span><span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .45s both">,</span>
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .5s both">near</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.08em;color:#00D4C8;border-bottom:2px solid rgba(0,212,200,.6);line-height:1;animation:{{ animNear }}">{{ near }}</span><span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .55s both">,</span>
      <span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .6s both">around</span>
      <span style="display:inline-block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1.08em;color:#00D4C8;border-bottom:2px solid rgba(0,212,200,.6);line-height:1;animation:{{ animPrice }}">{{ price }}</span><span style="display:inline-block;animation:wIn .9s cubic-bezier(.16,1,.3,1) .65s both">.</span>
    </p>
  </div>

  <div style="position:absolute;left:54px;right:54px;bottom:40px;display:flex;align-items:center;justify-content:flex-end;animation:cueIn 1.1s 1.2s both">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,241,236,.45)">Scroll</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
const BEDS = ["4 bed", "3 bed", "5 bed", "2 bed"];
const CITIES = ["San Jose", "Austin", "Los Angeles", "Houston", "San Diego"];
const VIBES = ["natural light", "a modern kitchen", "mountain views", "a garden"];
const NEAR = ["hiking trails", "good schools", "parks", "the downtown"];
const PRICES = ["$900K", "$650K", "$1.2M", "$475K"];

class Component extends DCLogic {
  state = { i: 0, n: 1284 };
  videoRef = React.createRef();
  componentDidMount() {
    const v = this.videoRef.current;
    if (v) { v.muted = true; v.defaultMuted = true; v.loop = true; v.play().catch(() => {}); }
    this.t = setInterval(() => this.setState(s => ({
      i: s.i + 1, n: 640 + Math.floor(Math.random() * 1500)
    })), 2900);
  }
  componentWillUnmount() { clearInterval(this.t); }
  anim(delay) {
    const name = this.state.i % 2 ? "swB" : "swA";
    const d = this.state.i === 0 ? delay : "0s";
    return `${name} .75s cubic-bezier(.16,1,.3,1) ${d} both`;
  }
  renderVals() {
    const i = this.state.i;
    const pick = a => a[i % a.length];
    return {
      videoRef: this.videoRef,
      beds: pick(BEDS), city: pick(CITIES), vibe: pick(VIBES), near: pick(NEAR), price: pick(PRICES),
      animBeds: this.anim(".2s"), animCity: this.anim(".35s"), animVibe: this.anim(".45s"),
      animNear: this.anim(".55s"), animPrice: this.anim(".65s"),
      matchLabel: this.state.n.toLocaleString() + " homes match"
    };
  }
}
</script>
</body>
</html>
